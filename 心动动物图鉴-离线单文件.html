  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7a59'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-size='32'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E" />
  <style>`n:root{--ink:#312b36;--muted:#857884;--cream:#fff7f0;--paper:#fffdfb;--coral:#ff7a59;--coral-dark:#dc5b42;--peach:#ffe3d7;--lav:#ece8ff;--line:#f0e5df;--shadow:0 18px 50px rgba(118,77,68,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(160deg,#fff7f0,#f9f3ff);color:var(--ink);font-family:ui-rounded,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #7a63ff;outline-offset:3px}.app-shell{width:min(100%,430px);min-height:100vh;margin:0 auto;padding:20px 18px 34px}.screen{min-height:calc(100vh - 54px);display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:24px}.brand{font-weight:800;color:var(--ink);letter-spacing:.03em}.hero{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:18px 0}.eyebrow{display:inline-flex;align-self:center;gap:6px;background:#fff0ea;color:#b5563f;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:700}.hero h1{font-size:clamp(34px,10vw,46px);line-height:1.06;margin:18px 0 10px;letter-spacing:-.05em}.hero p{font-size:16px;line-height:1.7;color:var(--muted);margin:0 auto;max-width:310px}.animal-cloud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px auto 26px;max-width:330px}.animal{background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:13px 4px;font-size:34px;box-shadow:0 10px 24px rgba(110,83,90,.08);animation:float 4s ease-in-out infinite}.animal:nth-child(2n){animation-delay:-1.5s}.animal small{display:block;font-size:11px;color:var(--muted);margin-top:5px}.primary{width:100%;min-height:54px;background:var(--coral);color:white;border-radius:18px;font-weight:800;box-shadow:0 11px 24px rgba(255,122,89,.28);transition:transform .15s,background .15s}.primary:hover{background:var(--coral-dark)}.primary:active{transform:scale(.98)}.ghost{background:transparent;color:var(--muted);font-size:14px;padding:12px}.tiny{font-size:12px;color:var(--muted);line-height:1.6;margin-top:13px}.card{background:rgba(255,253,251,.9);border:1px solid rgba(255,255,255,.9);border-radius:26px;padding:22px;box-shadow:var(--shadow)}.intro{margin:auto 0}.intro h2,.question h2{font-size:27px;letter-spacing:-.03em;margin:12px 0}.intro p,.question .scene{line-height:1.8;color:var(--muted);font-size:16px}.intro blockquote{margin:16px 0;padding:14px 16px;background:#fff2ec;border-radius:16px;color:#87544a;line-height:1.8}.progress-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}.progress{height:9px;background:#f0e6e2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#ffad72);border-radius:inherit;transition:width .35s}.question{margin-top:20px}.question .scene{background:#fff8f4;border-radius:16px;padding:14px;margin:14px 0 18px}.answers{display:grid;gap:10px}.answer{text-align:left;background:white;border:1px solid var(--line);border-radius:17px;padding:15px 16px;line-height:1.55;color:var(--ink);transition:transform .15s,border .15s,background .15s}.answer:hover{transform:translateY(-1px);border-color:#ffc0ad}.answer.selected{background:#fff0ea;border-color:var(--coral);box-shadow:0 8px 20px rgba(255,122,89,.13)}.answer b{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;background:#f7ece8;color:#b65a45;margin-right:8px;font-size:13px}.back{margin-top:14px}.analysis{text-align:center;justify-content:center}.orb{font-size:76px;animation:breathe 1.8s ease-in-out infinite}.analysis h2{font-size:26px;margin:22px 0 8px}.analysis p{color:var(--muted)}.result{text-align:center}.result .animal-big{font-size:100px;margin:6px 0 2px;filter:drop-shadow(0 14px 12px rgba(91,57,52,.15))}.result h1{font-size:36px;margin:5px 0}.quote{font-size:17px;line-height:1.7;color:#795c58;margin:13px auto 22px;max-width:330px}.pill-row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:15px 0}.pill{background:#fff0ea;color:#a34f3c;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700}.report h1{font-size:30px;margin:8px 0}.section-title{font-size:19px;margin:24px 0 10px}.dim{margin:14px 0}.dim-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}.dim-head span:last-child{color:var(--coral-dark);font-weight:800}.dimbar{height:10px;background:#f0e7e3;border-radius:99px;overflow:hidden}.dimbar i{display:block;height:100%;background:linear-gradient(90deg,#ffb08e,var(--coral));border-radius:inherit}.locked{background:#312b36;color:white}.locked p{color:#d9d0d2;line-height:1.7}.locked .primary{background:#ff9a6f;color:#3c1e19;box-shadow:none}.report-section{padding:17px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;margin:11px 0;line-height:1.8}.report-section h3{margin:0 0 6px;font-size:17px}.report-section p{margin:0;color:var(--muted)}.share-card{aspect-ratio:3/4;background:linear-gradient(160deg,#fff3e9,#f2edff);border-radius:26px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:var(--shadow);border:5px solid white}.share-card .animal-big{font-size:88px}.share-card h2{font-size:30px;margin:8px 0}.share-card .quote{font-size:15px}.footer-note{text-align:center;color:var(--muted);font-size:12px;line-height:1.7;margin-top:20px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes breathe{0%,100%{transform:scale(.96);opacity:.88}50%{transform:scale(1.05);opacity:1}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

  <script>`nconst P={golden:{name:'黏人金毛',emoji:'🐶',quote:'我喜欢你，所以我希望你能感觉到。',desc:'你的喜欢通常是有声音的。你会分享日常、主动靠近，也希望彼此都能明确感受到对方的存在。',keys:['热烈','真诚','主动','陪伴感'],base:[88,90,28,76]},black_cat:{name:'高冷黑猫',emoji:'🐈‍⬛',quote:'我没有说，不代表我没有。',desc:'你不是没有情绪，只是习惯把很多情绪留给自己消化。越是重要的人，反而越容易让你变得克制。',keys:['慢热','克制','边界','嘴硬心软'],base:[35,58,83,64]},deer:{name:'敏感小鹿',emoji:'🦌',quote:'你总能发现别人忽略的情绪。',desc:'你对关系里的细节非常敏锐。一个语气、一次停顿，都可能被你捕捉到。你的共情力很强，也因此更需要稳定回应。',keys:['细腻','共情','高感知','认真'],base:[53,91,42,94]},hedgehog:{name:'慢热刺猬',emoji:'🦔',quote:'不是不想靠近，只是想先确认这里安全。',desc:'你不会轻易把自己完全交给一段关系。你需要时间确认对方可靠，相信普通日子里的持续表现。',keys:['谨慎','防御','慢热','忠诚'],base:[27,84,62,79]},seagull:{name:'自由海鸥',emoji:'🕊️',quote:'喜欢你，也喜欢我自己的生活。',desc:'你不排斥亲密，但不会希望爱情成为生活的全部。你喜欢两个人在一起认真相处，分开时也都有自己的世界。',keys:['自由','独立','松弛','空间感'],base:[57,33,94,38]},fox:{name:'狡黠狐狸',emoji:'🦊',quote:'真正让我心动的，是我还没完全看懂你。',desc:'你对关系里的气氛和节奏很敏锐。你享受心动，也享受那一点没有完全揭晓的空间。',keys:['魅力','节奏','暧昧感','新鲜感'],base:[81,55,70,74]},capybara:{name:'温柔水豚',emoji:'🦫',quote:'不用猜，我们好好说。',desc:'你不太喜欢戏剧化的关系。相比反复试探，你更喜欢舒服、自然、稳定的相处。',keys:['稳定','温柔','包容','治愈感'],base:[58,63,58,47]},snow_leopard:{name:'清醒雪豹',emoji:'🐆',quote:'喜欢，不代表适合。',desc:'你当然会心动，但心动很少直接替你做决定。你会观察价值观、责任感和长期相处能力。',keys:['清醒','高标准','独立','长期主义'],base:[42,35,92,38]}};
const order=['golden','black_cat','deer','hedgehog','seagull','fox','capybara','snow_leopard'];
const Q=[
['凌晨的消息','已久没主动找你的那个人突然发来：“睡了吗？”',[['几乎秒回：“还没，怎么啦？”',{golden:2,deer:1}],['看到了，但故意等几分钟再回',{fox:2,black_cat:1}],['先想：是不是发生什么了？',{deer:2,hedgehog:1}],['明天再回也可以',{seagull:2,snow_leopard:1}]]],
['回复突然变慢','你们之前每天聊天，但最近两天 TA 回复越来越慢。',[['主动问：“你最近是不是很忙？”',{golden:2,capybara:1}],['表面不说，心里复盘所有聊天',{deer:2,hedgehog:1}],['对方慢，我也慢一点',{fox:2,black_cat:1}],['先做自己的事情，不会因为两天下结论',{snow_leopard:2,seagull:1}]]],
['第一次约会结束','今天的约会结束了，你会怎么做？',[['主动说下次再一起出来呀',{golden:2,capybara:1}],['等 TA 先来找我',{black_cat:2,hedgehog:1}],['想 TA 刚才是不是也有感觉',{deer:2,golden:1}],['不急着定义，先继续接触',{snow_leopard:2,seagull:1}]]],
['TA 和异性单独出去','伴侣和一位异性朋友单独出去。',[['有点不舒服，希望 TA 主动说明',{golden:2,deer:1}],['正常社交应该被尊重',{seagull:2,snow_leopard:1}],['观察 TA 有没有隐瞒',{black_cat:2,snow_leopard:1}],['开玩笑试探一下 TA',{fox:2,deer:1}]]],
['吵架之后','你们发生了争执。',[['再生气也想当天说清楚',{golden:2,capybara:1}],['自己待一会儿再谈',{black_cat:2,seagull:1}],['比起生气，更担心 TA 不要我了',{deer:2,golden:1}],['冷静后想清楚是谁的问题',{snow_leopard:2,hedgehog:1}]]],
['对方突然特别热情','一个人突然用很高的浓度靠近你。',[['如果我也喜欢，会觉得很甜',{golden:2,deer:1}],['会警惕是不是太快了',{hedgehog:2,snow_leopard:1}],['不拒绝，但不立刻跟上节奏',{black_cat:2,hedgehog:1}],['先享受暧昧，不急着定义',{fox:2,seagull:1}]]],
['恋爱后的周末','恋爱后，你理想的周末是？',[['最好一起待一天',{golden:2,capybara:1}],['一起吃饭散步，舒服最重要',{capybara:2,golden:1}],['约会，也各自有自己的安排',{seagull:2,snow_leopard:1}],['不一定每周见，质量比频率重要',{black_cat:2,snow_leopard:1}]]],
['TA 忘记重要日子','伴侣忘记了一个对你重要的日子。',[['最难受的是这件事对 TA 不重要',{deer:2,golden:1}],['至少应该认真道歉',{snow_leopard:2,capybara:1}],['嘴上没关系，心里扣很多分',{black_cat:2,hedgehog:1}],['平时很好，愿意给一次机会',{capybara:2,golden:1}]]],
['一个看不透的人','你遇到一个很难看透的人。',[['越看不透，越想知道 TA 在想什么',{fox:2,deer:1}],['有兴趣，但不会轻易投入',{black_cat:2,hedgehog:1}],['容易上头，也容易胡思乱想',{deer:2,golden:1}],['长期看不透就退出',{snow_leopard:2,seagull:1}]]],
['TA 说“我需要一点空间”','伴侣说最近需要一点空间。',[['很不安：是不是关系出问题了',{deer:2,golden:1}],['可以，但希望 TA 说清楚',{golden:2,capybara:1}],['能理解，每个人都有独处时刻',{seagull:2,black_cat:1}],['尊重，但长期不沟通会重新判断',{snow_leopard:2,black_cat:1}]]],
['对方很依赖你','伴侣很依赖你。',[['觉得幸福，说明 TA 需要我',{golden:2,deer:1}],['照顾 TA，但希望 TA 有自己的生活',{capybara:2,snow_leopard:1}],['太久会有压力',{seagull:2,black_cat:1}],['担心依赖变成束缚',{snow_leopard:2,hedgehog:1}]]],
['暧昧对象突然消失','暧昧对象突然消失几天。',[['发一句“你最近还好吗？”',{golden:2,capybara:1}],['很想发，但最后忍住',{deer:2,black_cat:1}],['不找我，我也不会找 TA',{black_cat:2,snow_leopard:1}],['等 TA 回来，看怎么解释',{fox:2,seagull:1}]]],
['关于报备','你怎么看恋爱中的报备？',[['是在乎一个人的表现',{golden:2,deer:1}],['是分享，不是义务',{capybara:2,seagull:1}],['不喜欢强制报备',{seagull:2,snow_leopard:1}],['更在意诚不诚实',{snow_leopard:2,black_cat:1}]]],
['伴侣情绪很差','伴侣今天情绪很差。',[['陪着 TA，怕一个人难受',{golden:2,capybara:1}],['给空间，需要我时我就在',{capybara:2,seagull:1}],['不追问，等 TA 自己想说',{black_cat:2,seagull:1}],['观察 TA 是需要空间还是回避问题',{snow_leopard:2,deer:1}]]],
['遇到很完美的人','你遇到一个看起来很完美的人。',[['喜欢为什么要忍',{golden:2,capybara:1}],['怀疑这么好的事真的会发生吗',{deer:2,hedgehog:1}],['越完美越想观察一段时间',{hedgehog:2,snow_leopard:1}],['可能反而少一点刺激感',{fox:2,seagull:1}]]],
['前任突然回来','前任突然回来找你。',[['有感情，想知道为什么回来',{golden:2,deer:1}],['会心软，但不一定表现',{deer:2,black_cat:1}],['先看导致分手的问题变了吗',{snow_leopard:2,hedgehog:1}],['可以聊，但不会轻易重启',{seagull:2,black_cat:1}]]],
['TA 不太会说情话','伴侣不太会说情话。',[['行动比情话让我安心',{capybara:2,snow_leopard:1}],['偶尔还是希望 TA 说出来',{golden:2,deer:1}],['稳定靠谱就够了',{snow_leopard:2,black_cat:1}],['会默默记住小细节',{deer:2,capybara:1}]]],
['恋爱中的最大恐惧','恋爱里你最大的恐惧是？',[['很爱，却得不到回应',{golden:2,deer:1}],['信任以后突然被辜负',{hedgehog:2,deer:1}],['为关系慢慢失去自己',{seagull:2,snow_leopard:1}],['知道不合适却舍不得离开',{snow_leopard:2,black_cat:1}]]],
['最想听到的一句话','你最想听到哪句话？',[['不管多忙，我都会记得找你',{golden:2,deer:1}],['你不用改变，我喜欢现在的你',{capybara:2,hedgehog:1}],['去做想做的事，我支持你',{seagull:2,snow_leopard:1}],['我认真考虑过我们的未来',{snow_leopard:2,hedgehog:1}]]],
['理想中的爱情','你理想中的爱情是？',[['多年后仍是最想分享生活的人',{golden:2,capybara:1}],['不用天天证明，一直坚定选择',{capybara:2,snow_leopard:1}],['都有自己的世界，也愿回到彼此身边',{seagull:2,black_cat:1}],['找到匹配的人，认真走很远',{snow_leopard:2,hedgehog:1}]]]
];
const KEY='loveAnimalTest';
function save(s){localStorage.setItem(KEY,JSON.stringify(s))} function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}} function reset(){localStorage.removeItem(KEY)}
function calc(answers){const scores=Object.fromEntries(order.map(x=>[x,0])); answers.forEach((a,i)=>{if(!a)return;Object.entries(Q[i][2][a][1]).forEach(([k,v])=>scores[k]+=v)});const ranking=[...order].sort((a,b)=>scores[b]-scores[a]||order.indexOf(a)-order.indexOf(b));const primary=ranking[0],secondary=ranking[1],tertiary=ranking[2];const match=Math.min(96,Math.max(72,70+(scores[primary]-scores[secondary])*4));const base=P[primary].base;const dims=base.map((v,i)=>Math.max(0,Math.min(100,v+((scores[primary]-scores[secondary])%5)-2+(i%2))));return{scores,ranking,primary,secondary,tertiary,match,dimensions:{initiative:dims[0],securityNeed:dims[1],independence:dims[2],sensitivity:dims[3]}}}
function btn(t,fn,cls='primary'){return `<button class="${cls}" data-action="${fn}">${t}</button>`} function render(html){document.querySelector('#app').innerHTML=html;window.scrollTo(0,0)}
function home(){const s=load();render(`<div class="screen"><div class="topbar"><span class="brand">心动动物图鉴</span><span>娱乐 · 自我探索</span></div><section class="hero"><span class="eyebrow">🐾 恋爱人格小测试</span><h1>测测你在爱情里<br>是哪一种动物</h1><p>20 个恋爱情境 · 8 种恋爱人格</p><div class="animal-cloud">${Object.values(P).map(x=>`<div class="animal">${x.emoji}<small>${x.name.replace('黏人','').replace('高冷','').replace('敏感','').replace('慢热','').replace('自由','').replace('狡黠','').replace('温柔','').replace('清醒','')}</small></div>`).join('')}</div>${s&&s.answers?.some(Boolean)?btn('继续上次测试','continue'):btn('开始测试','intro')}<div class="tiny">约 3 分钟 · 没有正确答案<br>本测试仅用于娱乐和自我探索，不构成心理或医学诊断。</div></section></div>`)}
function intro(){render(`<div class="screen"><div class="topbar"><button class="ghost" data-action="home">← 返回</button><span>测试说明</span><span></span></div><section class="card intro"><span class="eyebrow">准备好了吗？</span><h2>在开始之前……</h2><blockquote>接下来，你会经历 20 个恋爱情境。<br>没有正确答案，也不用选择“最成熟”的答案。<br><br>请选择：如果真的发生在你身上，你最可能做出的反应。<br><br>别想太久。第一反应，往往更像你。</blockquote>${btn('进入我的恋爱世界','start')}</section></div>`)}
function start(){save({answers:Array(20).fill(null),index:0,startedAt:new Date().toISOString()});question(0)} function continueTest(){const s=load();question(s?.index||0)}
function question(i){const s=load()||{answers:Array(20).fill(null),index:i};s.index=i;save(s);const q=Q[i];const pct=Math.round((i/20)*100);render(`<div class="screen"><div class="topbar"><button class="ghost" data-action="home">退出</button><span>${String(i+1).padStart(2,'0')} / 20</span><span>心动信号</span></div><div class="progress"><i style="width:${pct}%"></i></div><section class="question"><h2>${q[0]}</h2><div class="scene">${q[1]}</div><div class="answers">${q[2].map((a,n)=>`<button class="answer ${s.answers[i]===n?'selected':''}" data-answer="${n}"><b>${'ABCD'[n]}</b>${a[0]}</button>`).join('')}</div><button class="ghost back" data-action="back" ${i===0?'disabled':''}>← 返回上一题</button></section></div>`)}
function analyzing(){const s=load();const result=calc(s.answers);s.result=result;s.completed=true;save(s);render(`<div class="screen analysis"><div class="orb">💫</div><h2>正在读取你的心动信号……</h2><p>正在寻找你的安全感来源</p></div>`);setTimeout(()=>resultPage(),2100)}
function resultPage(){const r=load()?.result;if(!r)return home();const p=P[r.primary];render(`<div class="screen result"><div class="topbar"><span class="brand">心动动物图鉴</span><span>结果揭晓</span></div><div class="card"><div class="eyebrow">你的恋爱动物是</div><div class="animal-big">${p.emoji}</div><h1>${p.name}</h1><div class="pill">匹配浓度 ${r.match}%</div><p class="quote">“${p.quote}”</p><div class="pill-row">${p.keys.map(k=>`<span class="pill">${k}</span>`).join('')}</div>${btn('看看我的免费报告','report')}</div><div class="tiny">隐藏人格：${P[r.secondary].name} · 恋爱底色：${P[r.tertiary].name}</div></div>`)}
function report(){const r=load()?.result;if(!r)return home();const p=P[r.primary];const names=['主动程度','安全感需求','独立需求','情绪敏感度'],icons=['❤️','🛡️','🌿','✨'];render(`<div class="screen report"><div class="topbar"><button class="ghost" data-action="result">← 结果</button><span>恋爱报告</span><button class="ghost" data-action="share">分享</button></div><h1>${p.emoji} ${p.name}</h1><p class="quote">${p.desc}</p><div class="card"><div class="eyebrow">四维恋爱属性</div>${names.map((n,i)=>`<div class="dim"><div class="dim-head"><span>${icons[i]} ${n}</span><span>${Object.values(r.dimensions)[i]}</span></div><div class="dimbar"><i style="width:${Object.values(r.dimensions)[i]}%"></i></div></div>`).join('')}</div><h2 class="section-title">完整恋爱说明书</h2><div class="card"><p>继续看看你在关系里的真实样子、隐藏弱点、匹配类型和恋爱建议。</p>${btn('查看完整报告','full')}</div><div class="tiny">隐藏人格：${P[r.secondary].name} · 恋爱底色：${P[r.tertiary].name}</div><button class="ghost" data-action="restart">感觉不像你？重新测试</button></div>`)}
function fullReport(){const r=load()?.result;if(!r)return home();const p=P[r.primary];const sections=[['你在爱情里的真实样子',p.desc],['你真正需要的是什么',`你需要的不是某一种固定相处频率，而是被认真对待的感觉。对你来说，稳定的行动比漂亮的承诺更有分量。`],['你为什么容易对某类人上头',`你会被${P[r.secondary].name}身上与你互补的部分吸引。那种熟悉又不同的感觉，会让你忍不住想靠近。`],['你的隐藏弱点','当关系变得不确定时，你可能会把更多精力花在猜测和证明上。请记得，爱不是单方面完成的任务。'],['你最容易陷入的关系模式','忽冷忽热和长期暧昧最容易消耗你的能量。观察长期行动，比追逐某一个瞬间更重要。'],['最适合你的伴侣',`愿意稳定回应你、尊重你的边界，也有自己的生活。${P[r.tertiary].name}的特质通常会让你更放松。`],['最容易产生拉扯的类型',`和${P[r.secondary].name}相处时，你们可能既有吸引力，也需要更主动地说明自己的节奏。`],['给你的三条恋爱建议','把需要说出来；看长期行动；不要用更多付出来换确定感。']];render(`<div class="screen report"><div class="topbar"><button class="ghost" data-action="report">← 恋爱报告</button><span>完整报告</span><button class="ghost" data-action="share">分享</button></div><div class="card"><div class="eyebrow">${p.emoji} ${p.name} · 完整恋爱说明书</div>${sections.map(s=>`<article class="report-section"><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join('')}</div><button class="ghost" data-action="restart">重新测试</button></div>`)}
function share(){const r=load()?.result;if(!r)return home();const p=P[r.primary];render(`<div class="screen report"><div class="topbar"><button class="ghost" data-action="report">← 返回</button><span>分享结果卡</span><span></span></div><div class="share-card" id="share-card"><div class="eyebrow">心动动物图鉴</div><div class="animal-big">${p.emoji}</div><div>我的恋爱动物</div><h2>${p.name}</h2><p class="quote">“${p.quote}”</p><div class="pill">匹配浓度 ${r.match}%</div><div class="tiny">隐藏人格：${P[r.secondary].name}<br>你的恋爱动物是什么？</div></div>${btn('保存结果卡','download')}<div class="footer-note">截图分享给朋友，看看你们是不是同一种动物。</div></div>`)}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='home')home();if(a==='intro')intro();if(a==='start')start();if(a==='continue')continueTest();if(a==='back'){const i=load()?.index||0;question(Math.max(0,i-1))}if(a==='result')resultPage();if(a==='report')report();if(a==='full')fullReport();if(a==='share')share();if(a==='restart'){if(confirm('重新测试会清除当前答题记录。')){reset();home()}}if(a==='download'){const el=document.getElementById('share-card');const blob=new Blob([`<!doctype html><html><body>${el.outerHTML}<style>body{margin:0;padding:20px;font-family:Arial;color:#312b36}.share-card{width:360px;height:480px;text-align:center;background:linear-gradient(160deg,#fff3e9,#f2edff);padding:40px;box-sizing:border-box}.animal-big{font-size:90px}.quote{font-size:16px}</style></body></html>`],{type:'text/html'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download='心动动物图鉴-结果卡.html';link.click();URL.revokeObjectURL(url)}});document.addEventListener('click',e=>{const el=e.target.closest('[data-answer]');if(!el)return;const s=load()||{answers:Array(20).fill(null),index:0};const i=s.index;s.answers[i]=Number(el.dataset.answer);save(s);el.classList.add('selected');setTimeout(()=>i===19?analyzing():question(i+1),180)});home();
`n</script>
